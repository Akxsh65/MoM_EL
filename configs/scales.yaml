# Svarasthana set per raga (arohana U avarohana) as 12-position indices above Sa.
# Index key: 0 S | 1 R1 | 2 R2(=G1) | 3 R3(=G2) | 4 G3 | 5 M1 | 6 M2 | 7 P | 8 D1 | 9 D2(=N1) | 10 D3(=N2) | 11 N3
#
# VERIFIED 2026-11-28 against external pages (replaces the from-memory table of 2026-11-27, which had 16 wrong entries).
# Rule: union of the printed arohana and avarohana. Anya (occasional foreign) svaras that a page names separately are NOT
# counted (Kamas N3, Atana G2/N2, Bilahari N2, Anandabhairavi G3/D1/N3, Devagandhari's N2 IS in the printed avarohana so it is).
# Sources: W = English Wikipedia raga page; R = ragasurabhi.com raga page (carnatic-music/raga/raga--<name>.html);
# M = Medium "Ragapedia" (Konjam Karnatik); N = NIOS Carnatic Music course book KCM-5 (Kamas). "W+R" = two sources agree.
# `verify: true` marks entries backed by ONE source only, or where sources conflict. They still drive B1 labels, so a person
# who knows the ragas should look at them; each one is listed in docs/decisions.md.
# These sets only drive the easy (<=4 shared svaras) / hard (>=6 shared) labelling of neighbouring ragas in B1.
